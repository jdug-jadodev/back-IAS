spring.application.name=demo

spring.r2dbc.url=r2dbc:postgresql://localhost:5432/DATABAE_IAS
spring.r2dbc.username=ias
spring.r2dbc.password=ias

spring.sql.init.mode=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

spring.r2dbc.properties.connectTimeout=PT3S
spring.r2dbc.properties.lockWaitTimeout=PT2S
spring.r2dbc.properties.statementTimeout=PT5S
spring.r2dbc.pool.max-acquire-time=3s
spring.r2dbc.pool.max-create-connection-time=3s
spring.r2dbc.pool.max-validation-time=2s
spring.r2dbc.pool.acquire-retry=0
app.database.operation-timeout=10s

app.rate-limit.enabled=true
app.rate-limit.capacity=30
app.rate-limit.refill-period=1m
app.rate-limit.max-clients=10000
server.forward-headers-strategy=none
